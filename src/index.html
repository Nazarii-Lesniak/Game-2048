<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game 2048</title>
    <link rel="icon" href="/src/assets/favicon.png" />
    <link rel="stylesheet" href="./styles/main.scss" />
  </head>
  <body>
    <main class="app">

      <header class="header">
        <div class="header__controls">
          <h1>2048</h1>

          <p class="header__info">
            Current score:
            <span class="header__score">0</span>
          </p>
          <button class="header__button header__button--start" type="button">Start</button>
        </div>
      </header>

      <section class="game-board" aria-label="Game board">
        <div class="game-container">
          <div class="game-cell"></div>
          <div class="game-cell"></div>
          <div class="game-cell"></div>
          <div class="game-cell"></div>
          <div class="game-cell"></div>
          <div class="game-cell"></div>
          <div class="game-cell"></div>
          <div class="game-cell"></div>
          <div class="game-cell"></div>
          <div class="game-cell"></div>
          <div class="game-cell"></div>
          <div class="game-cell"></div>
          <div class="game-cell"></div>
          <div class="game-cell"></div>
          <div class="game-cell"></div>
          <div class="game-cell"></div>
        </div>
        <div class="tile-container"></div>
      </section>

      <section class="message-container" aria-live="polite">
        <p class="message message-lose hidden">You lose! Restart the game?</p>
        <p class="message message-win hidden">Winner! Congrats! You did it!</p>
        <p class="message message-start">
          Press "Start" to begin game. Good luck!
        </p>
      </section>
    </main>
    <script type="module" src="scripts/main.js"></script>
  </body>
</html>
